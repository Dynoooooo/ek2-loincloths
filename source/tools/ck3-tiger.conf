# ck3-tiger config for EK2 Loincloths: load EK2 first, so its triggers and cultures resolve.
#   ~/.cargo/bin/ck3-tiger --config source/tools/ck3-tiger.conf ../ek2_loincloths.mod
# Remaining reports in EK2/vanilla files (camp_purpose_* laws, change_spiritual_fulfillment, ...) are tiger 1.19 not
# knowing CK3 1.20; read only the [MOD] lines that point at our own files.
languages = { check = "english" }
load_mod = {
	label = "EK2"
	modfile = "~/Documents/Paradox Interactive/Crusader Kings III/mod/ek2_loincloths/source/tools/ek2_for_tiger.mod"
}
