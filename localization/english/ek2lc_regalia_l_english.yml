l_english:
 artifact_ek2lc_loincloth_regalia: "Ceremonial Regalia"
 artifacts_artifact_type_ek2lc_loincloth_regalia: "Ceremonial Loincloth Regalia"
 artifact_type_ek2lc_loincloth_regalia: "ceremonial regalia"
 ek2lc_regalia_art_champion_name: "Champion's Apron"
 ek2lc_regalia_art_champion_desc: "A tall belt of dark silk wound with gold cord, and below it an apron that falls to the shins, embroidered with a sun over a mountain and hemmed in gold fringe. Patrons give such aprons to the fighters they favour, and a champion wears it to step before the crowd."
 ek2lc_regalia_art_fauld_name: "Malacath's Iron Fauld"
 ek2lc_regalia_art_fauld_desc: "A riveted iron belt with four overlapping iron lames hanging in front, tied with leather straps, and a boss at the buckle stamped for Malacath. Stronghold smiths make it for those who stand in the front rank."
 ek2lc_regalia_art_feather_name: "Feather Girdle of the Ancestors"
 ek2lc_regalia_art_feather_desc: "A sash covered in red and gold feathers, fringed with more feathers all round, and a long tail on the left hip strung with teeth. Each wearer is said to add the mana of those who wore it before."
 ek2lc_regalia_art_briar_name: "Briarheart Girdle"
 ek2lc_regalia_art_briar_desc: "A tooled belt of Reach hide stamped with bear, elk, wolf and raven, bound in two thorned briar vines, with a bronze bear plaque at the front and hagraven feathers at the hips."
 ek2lc_regalia_art_amber_name: "Hist-Amber Wrap"
 ek2lc_regalia_art_amber_desc: "A hip wrap of tightly woven marsh grass, with strings of Hist-resin amber hanging across the front and two plates of tortoise shell at the hips."
 ek2lc_regalia_art_bone_name: "Green Pact Bone Apron"
 ek2lc_regalia_art_bone_desc: "A rawhide belt hung front and back with rows of bone hairpipes and beetle-shell beads. No wood, no plant fibre: everything in it comes from the hunt, as the Green Pact asks."
 ek2lc_regalia_art_ash_name: "Ancestor-Ash Tassets"
 ek2lc_regalia_art_ash_desc: "Two crossing belts of guar leather, a carved chitin buckle, and enamelled chitin tassets over the thighs in the colours of the tribe. Ashlanders say their ancestors see them better when they wear it."
 ek2lc_regalia_art_moon_name: "Mane's Moon Silk"
 ek2lc_regalia_art_moon_desc: "A sash of deep purple silk embroidered with crescent moons, knotted at the hip with two long tails, and two discs hanging from the knot: red Masser and silver Secunda."
 ek2lc_commission_regalia_decision: "Commission Ceremonial Regalia"
 ek2lc_commission_regalia_decision_desc: "The weavers, bead-workers and smiths of our people can make regalia worthy of a ruler: a girdle or apron worn over the loincloth at court, and passed down the line."
 ek2lc_commission_regalia_decision_tooltip: "Order a wearable regalia artifact that shows on your portrait."
 ek2lc_commission_regalia_decision_confirm: "Summon the weavers"
 ek2lc_commission_regalia_decision_effect_tt: "You choose a style and how fine a work. Some months later the regalia is finished, if all goes well, and you wear it at once."
 ek2lc_commission_pending_tt: "The weavers are already at work on your regalia"
 ek2lc_regalia.0001.t: "The Weavers' Hall"
 ek2lc_regalia.0001.desc: "The master weaver bows and lays out samples on the floor: dyed hide, silk, beadwork, feathers, iron lames. "Tell us what you wish to wear, and we will make it.""
 ek2lc_regalia.0001.home_art_fauld: "Our own people's work: Malacath's Iron Fauld"
 ek2lc_regalia.0001.home_art_feather: "Our own people's work: a Feather Girdle of the Ancestors"
 ek2lc_regalia.0001.home_art_briar: "Our own people's work: a Briarheart Girdle"
 ek2lc_regalia.0001.home_art_amber: "Our own people's work: a Hist-Amber Wrap"
 ek2lc_regalia.0001.home_art_bone: "Our own people's work: a Green Pact Bone Apron"
 ek2lc_regalia.0001.home_art_ash: "Our own people's work: Ancestor-Ash Tassets"
 ek2lc_regalia.0001.home_art_moon: "Our own people's work: Mane's Moon Silk"
 ek2lc_regalia.0001.champion: "A Champion's Apron, long and embroidered"
 ek2lc_regalia.0001.feather: "A Feather Girdle of the Ancestors"
 ek2lc_regalia.0001.foreign: "Show me what other peoples wear"
 ek2lc_regalia.0001.cancel: "Not now"
 ek2lc_regalia.0002.t: "Foreign Fashions"
 ek2lc_regalia.0002.desc: ""We have traded with every people from the Reach to Elsweyr," the weaver says. "Their styles are not ours, but we know them.""
 ek2lc_regalia.0002.art_fauld: "Malacath's Iron Fauld"
 ek2lc_regalia.0002.art_briar: "Briarheart Girdle"
 ek2lc_regalia.0002.art_amber: "Hist-Amber Wrap"
 ek2lc_regalia.0002.art_bone: "Green Pact Bone Apron"
 ek2lc_regalia.0002.art_ash: "Ancestor-Ash Tassets"
 ek2lc_regalia.0002.art_moon: "Mane's Moon Silk"
 ek2lc_regalia.0002.back: "Let me think again"
 ek2lc_regalia.0003.t: "How Fine a Work?"
 ek2lc_regalia.0003.desc: ""Rough work is quick and cheap. Fine work takes longer. A masterwork takes the whole guild half a year, and it will outlive your grandchildren.""
 ek2lc_regalia.0003.rough: "Rough work will do"
 ek2lc_regalia.0003.fine: "Fine work"
 ek2lc_regalia.0003.masterwork: "Nothing less than a masterwork"
 ek2lc_regalia.0003.cancel: "I have changed my mind"
 ek2lc_regalia.0003.wait_tt: "The regalia will be ready in a few months"
 ek2lc_regalia.0010.t: "The Regalia Is Finished"
 ek2lc_regalia.0010.desc: "The weavers carry it in on a cushion: [ek2lc_new_regalia.GetName]. They tie it on you themselves, and the court falls silent to look."
 ek2lc_regalia.0010.a: "Let them look!"
 ek2lc_regalia.0010.b: "We thank the ancestors for such hands"
 ek2lc_regalia.0011.t: "The Weaver Has Fled"
 ek2lc_regalia.0011.desc: "The workshop is empty: the looms cold, the beads gone, and the master weaver with them, together with your gold."
 ek2lc_regalia.0011.a: "Hunt them down!"
 ek2lc_regalia.0011.a.found: "The weaver is found hiding with the half-finished work, and finishes it under guard"
 ek2lc_regalia.0011.a.lost: "The trail goes cold"
 ek2lc_regalia.0011.b: "Let them go. The gold is lost"
 ek2lc_regalia.0012.t: "An Offer for the Work"
 ek2lc_regalia.0012.desc: "[ek2lc_bidder.GetTitledFirstName] has seen your regalia on the loom and wants it badly: they offer to buy it for 150 gold before it is even finished."
 ek2lc_regalia.0012.a: "Sell it"
 ek2lc_regalia.0012.b: "It is not for sale"
 ek2lc_regalia.0020.t: "A Gift of Cloth"
 ek2lc_regalia.0020.desc: "[ek2lc_patron.GetTitledFirstName] has sent a Champion's Apron to court, embroidered and fringed with gold, as a gift for [ek2lc_champion.GetFirstName], who fights in your name. By custom it is yours to bestow."
 ek2lc_regalia.0020.a: "Let [ek2lc_champion.GetFirstName] wear it with pride"
 ek2lc_regalia.0020.b: "Such an apron belongs to the ruler"
 ek2lc_regalia.0030.t: "Moths in the Wardrobe"
 ek2lc_regalia.0030.desc: "A servant brings [ek2lc_moth_regalia.GetName] with a worried look: moths have been at it, and some of the work is coming loose."
 ek2lc_regalia.0030.a: "Have the weavers mend it"
 ek2lc_regalia.0030.b: "A little wear shows its age"
 ek2lc_regalia.0040.t: "The Forebear's Regalia"
 ek2lc_regalia.0040.desc: "[ek2lc_heirloom.GetName] was made for [ek2lc_forebear.GetFirstName], and now it is yours. The elders say you should wear it before the whole court, so all can see whose heir you are."
 ek2lc_regalia.0040.a: "Wear it before the court"
 ek2lc_regalia.0040.b: "Keep it safe, and pray to the ancestors"
 ek2lc_life.0001.t: "The First Loincloth"
 ek2lc_life.0001.desc: "At fourteen you are given your first warrior's loincloth, plain hide with a single mark painted on it by the elders. Which beast's mark will you carry?"
 ek2lc_life.0001.bear: "The bear: strength"
 ek2lc_life.0001.raven: "The raven: cunning"
 ek2lc_life.0001.elk: "The elk: endurance and plenty"
 ek2lc_life.0002.t: "[ROOT.Char.GetFirstName]'s First Loincloth"
 ek2lc_life.0002.desc: "[ROOT.Char.GetFirstName] has turned fourteen, and today receives a first warrior's loincloth. By custom a parent ties the knot."
 ek2lc_life.0002.a: "I will tie it myself"
 ek2lc_life.0002.b: "Let the elders do it"
 ek2lc_life.0010.t: "Another Trophy for the Belt"
 ek2lc_life.0010.desc: "After the battle your warriors bring you a tooth from the field, to hang from your belt with the others. You have won [ROOT.Char.MakeScope.Var('ek2lc_battles_won').GetValue|0] battles now."
 ek2lc_life.0010.a: "Hang it with the others"
 ek2lc_life.0010.b: "Let the enemy see it and despair"
 ek2lc_life.0020.t: "The Knot Gives Way"
 ek2lc_life.0020.desc: "In the middle of the feast, as you rise to toast your guests, the knot of your loincloth gives way. You catch it in time, but the whole hall saw."
 ek2lc_life.0020.a: "Laugh, and retie it"
 ek2lc_life.0020.b: "Who tied this? Fetch the weaver!"
 ek2lc_life.0020.c: "Announce that this is how it is worn now"
 ek2lc_life.0030.t: "The Weavers' Petition"
 ek2lc_life.0030.desc: "The weavers' guild asks that fine-spun cloth, dyed hide and beadwork be kept for the nobility, as the old law said. Commoners, they complain, now dress like chiefs."
 ek2lc_life.0030.a: "The old law stands: fine cloth for the noble"
 ek2lc_life.0030.b: "Let anyone wear what they can make"
 ek2lc_life.0030.c: "Let them wear it, and pay for the right"
 ek2lc_life.0040.t: "A Scandalised Guest"
 ek2lc_life.0040.desc: "[ek2lc_envoy.GetTitledFirstName] cannot take their eyes off the court's dress, or rather the lack of it, and has asked whether you could perhaps put on a robe."
 ek2lc_life.0040.a: "This is how our people dress"
 ek2lc_life.0040.b: "Give our guest a robe of their own"
 ek2lc_life.0040.c: "Explain our customs, and win them over"
 ek2lc_life.0050.t: "The Sap of the Hist"
 ek2lc_life.0050.desc: "The tenders of the Hist offer to steep your loincloth and regalia in its sap, as the old ones did. Those who wear what the Hist has touched are said to hear it in their sleep."
 ek2lc_life.0050.a: "Let the Hist touch it"
 ek2lc_life.0050.b: "The Hist knows me already"
 ek2lc_life.0070.t: "Hircine's Night"
 ek2lc_life.0070.desc: "You wake at dawn in the forest, the taste of blood in your mouth, and of your loincloth nothing is left but shreds on the brambles."
 ek2lc_life.0070.a: "Send quietly for a new one"
 ek2lc_life.0070.b: "Let them see what the Hunter made of me"
 ek2lc_life.0080.t: "A Cold Snap"
 ek2lc_life.0080.desc: "The frost has come early. [ek2lc_cold.GetFirstName] is shivering in the hall in nothing but a loincloth, and asks for hide leggings and a fur."
 ek2lc_life.0080.a: "Give them leggings and a fur"
 ek2lc_life.0080.b: "The cold makes us strong"
 ek2lc_clan_mark_bear_modifier: "Mark of the Bear"
 ek2lc_clan_mark_bear_modifier_desc: "The bear painted on this character's first loincloth."
 ek2lc_clan_mark_raven_modifier: "Mark of the Raven"
 ek2lc_clan_mark_raven_modifier_desc: "The raven painted on this character's first loincloth."
 ek2lc_clan_mark_elk_modifier: "Mark of the Elk"
 ek2lc_clan_mark_elk_modifier_desc: "The elk painted on this character's first loincloth."
 ek2lc_tie_snapped_modifier: "The Knot That Gave Way"
 ek2lc_tie_snapped_modifier_desc: "The whole court still talks about the feast."
 ek2lc_loincloth_fashion_modifier: "Setter of Fashions"
 ek2lc_loincloth_fashion_modifier_desc: "This character made a mishap into a fashion."
 ek2lc_sumptuary_enforced_modifier: "Sumptuary Law"
 ek2lc_sumptuary_enforced_modifier_desc: "Fine cloth is kept for the nobility."
 ek2lc_sumptuary_relaxed_modifier: "Cloth for All"
 ek2lc_sumptuary_relaxed_modifier_desc: "Anyone may wear what they can make."
 ek2lc_fine_cloth_tax_modifier: "Fine Cloth Tax"
 ek2lc_fine_cloth_tax_modifier_desc: "Commoners pay for the right to wear fine cloth."
 ek2lc_hist_blessed_modifier: "Touched by the Hist"
 ek2lc_hist_blessed_modifier_desc: "This character's dress was steeped in the sap of the Hist."
 ek2lc_proud_dress_modifier: "Proud of Our Dress"
 ek2lc_proud_dress_modifier_desc: "This character refused to dress like a foreigner."
 ek2lc_hircine_hunt_modifier: "Hunter's Mark"
 ek2lc_hircine_hunt_modifier_desc: "This character wears the shreds of Hircine's night openly."
 trait_ek2lc_loincloth_maker_1: "Apprentice Loincloth Maker"
 trait_ek2lc_loincloth_maker_1_desc: "This character has learned to cut hide, twist sinew and tie a loincloth that stays tied."
 trait_ek2lc_loincloth_maker_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has learned to cut hide, twist sinew and tie a loincloth that stays tied."
 trait_ek2lc_loincloth_maker_2: "Journeyman Loincloth Maker"
 trait_ek2lc_loincloth_maker_2_desc: "This character weaves, dyes and beads fine work, and is trusted with a ruler's commissions."
 trait_ek2lc_loincloth_maker_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] weaves, dyes and beads fine work, and is trusted with a ruler's commissions."
 trait_ek2lc_loincloth_maker_3: "Master Loincloth Maker"
 trait_ek2lc_loincloth_maker_3_desc: "This character makes regalia that are handed down for generations, and other weavers come to learn from them."
 trait_ek2lc_loincloth_maker_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] makes regalia that are handed down for generations, and other weavers come to learn from them."
 trait_ek2lc_loincloth_maker: "Loincloth Maker"
 ek2lc_loincloth_maker_court_position: "Loincloth Maker"
 ek2lc_loincloth_maker_court_position_desc: "The $ek2lc_loincloth_maker_court_position$ keeps the court's weavers, bead-workers and tanners, and makes the ruler's regalia."
 ek2lc_loincloth_maker_employer_desc: "$BULLET$Regalia commissions cost less (a Master: much less), are ready sooner, turn out finer, and the weaver seldom runs off\n$BULLET$The $ek2lc_loincloth_maker_court_position$ rises in rank with every work"
 relation_ek2lc_loincloth_maker_female: "loincloth maker"
 relation_ek2lc_loincloth_maker_male: "loincloth maker"
 relation_ek2lc_loincloth_maker_female_possessive: "loincloth maker's"
 relation_ek2lc_loincloth_maker_male_possessive: "loincloth maker's"
 ek2lc_aptitude_master_maker: "Master Loincloth Maker"
 ek2lc_aptitude_journeyman_maker: "Journeyman Loincloth Maker"
 ek2lc_aptitude_apprentice_maker: "Apprentice Loincloth Maker"
 ek2lc_aptitude_diligent: "Diligent"
 ek2lc_aptitude_lazy: "Lazy"
 ek2lc_regalia.0013.t: "The Dye Ran"
 ek2lc_regalia.0013.desc: "The work is finished, but the dye ran in the vats: the colours are not what you ordered, and the weavers will not meet your eye."
 ek2lc_regalia.0013.a: "I will wear it as it is"
 ek2lc_regalia.0013.b: "Dye it again, properly"
 ek2lc_regalia.0050.t: "Stolen at the Feast"
 ek2lc_regalia.0050.desc: "When the feast is over and the guests are gone, so is [ek2lc_stolen.GetName]."
 ek2lc_regalia.0050.a: "Search every guest!"
 ek2lc_regalia.0050.a.found: "The thief is caught wearing it under a cloak"
 ek2lc_regalia.0050.a.lost: "It is never seen again"
 ek2lc_regalia.0050.b: "Let it go"
 ek2lc_regalia.0060.t: "A Gift for the Needle"
 ek2lc_regalia.0060.desc: "[ek2lc_weaver.GetTitledFirstName] has been mending the court's loincloths in secret, and the work is better than the weavers'."
 ek2lc_regalia.0060.a: "Make them my Loincloth Maker"
 ek2lc_regalia.0060.b: "Let them learn the craft"
 ek2lc_regalia.0060.c: "We have weavers enough"
 ek2lc_life.0100.t: "Going Native"
 ek2lc_life.0100.desc: "You have seen how the loincloth peoples dress, and you have come to admire it. Whose dress will you take up?"
 ek2lc_life.0100.reach: "The Reachfolk's hide and bone"
 ek2lc_life.0100.ashlander: "The Ashlanders' netch leather and chitin"
 ek2lc_life.0100.bosmer: "The Bosmer's hide and beads"
 ek2lc_life.0100.argonian: "The Saxhleel's woven grass and scale"
 ek2lc_life.0100.khajiit: "The Khajiit's silk and gold"
 ek2lc_life.0100.orc: "The Orsimer's leather and iron"
 ek2lc_life.0100.goblin: "The goblins' scraps and trophies"
 ek2lc_life.0100.kothringi: "The Kothringi's marsh weave"
 ek2lc_life.0100.lilmothiit: "The Lilmothiit's furs and feathers"
 ek2lc_loincloth_festival_decision: "Proclaim a Loincloth Festival"
 ek2lc_loincloth_festival_decision_desc: "For one season the whole court will wear the plain white festival wrap, feast, wrestle and dance in the old way."
 ek2lc_loincloth_festival_decision_tooltip: "Your court wears festival wraps for a season."
 ek2lc_loincloth_festival_decision_confirm: "Let the festival begin!"
 ek2lc_go_native_decision: "Go Native"
 ek2lc_go_native_decision_desc: "Put away your own people's robes and dress as a loincloth people does, at court and in war."
 ek2lc_go_native_decision_tooltip: "Wear a loincloth people's dress, regalia and looks."
 ek2lc_go_native_decision_confirm: "Off with the robes"
 ek2lc_end_native_decision: "Return to Your Own Dress"
 ek2lc_end_native_decision_desc: "Dress as your own people do again."
 ek2lc_end_native_decision_tooltip: "Stop wearing a loincloth people's dress."
 ek2lc_end_native_decision_confirm: "Fetch my robes"
 ek2lc_mourning_modifier: "Mourning"
 ek2lc_mourning_modifier_desc: "This character mourns a close relative, and wears the dark wrap."
 ek2lc_loincloth_festival_modifier: "Loincloth Festival"
 ek2lc_loincloth_festival_modifier_desc: "The court celebrates in festival wraps."
 ek2lc_gone_native_modifier: "Gone Native"
 ek2lc_gone_native_modifier_desc: "This character dresses as a loincloth people does."
 rule_ek2lc_frequency: "Loincloth Frequency"
 rule_ek2lc_frequency_desc: "How many of the loincloth peoples wear loincloths (the rest wear EK2's clothes)."
 setting_ek2lc_frequency_always: "Always"
 setting_ek2lc_frequency_always_desc: "Everyone of the loincloth peoples aged 4 and up."
 setting_ek2lc_frequency_often: "Often"
 setting_ek2lc_frequency_often_desc: "About two in three."
 setting_ek2lc_frequency_sometimes: "Sometimes"
 setting_ek2lc_frequency_sometimes_desc: "About one in three."
 rule_ek2lc_nobles: "Loincloths for Nobles"
 rule_ek2lc_nobles_desc: "Whether nobles, knights and court officers of the loincloth peoples wear the fine loincloth."
 setting_ek2lc_nobles_on: "On"
 setting_ek2lc_nobles_on_desc: "They do."
 setting_ek2lc_nobles_off: "Off"
 setting_ek2lc_nobles_off_desc: "They wear EK2's clothes; rulers keep their royal looks."
 rule_ek2lc_war_looks: "Loincloth War Looks"
 rule_ek2lc_war_looks_desc: "War girdles and armoured strip skirts for warriors at war."
 setting_ek2lc_war_looks_on: "On"
 setting_ek2lc_war_looks_on_desc: "Warriors at war wear them."
 setting_ek2lc_war_looks_off: "Off"
 setting_ek2lc_war_looks_off_desc: "Warriors keep their everyday look."
 rule_ek2lc_events: "Loincloth Events and Decisions"
 rule_ek2lc_events_desc: "The loincloth events, the regalia commissions, the festival and Go Native."
 setting_ek2lc_events_on: "On"
 setting_ek2lc_events_on_desc: "On."
 setting_ek2lc_events_off: "Off"
 setting_ek2lc_events_off_desc: "None of them (the looks stay)."
 ek2lc_giant_gathering_decision: "Go to the Gathering at the Stones"
 ek2lc_giant_gathering_decision_desc: "Every few years the giant clans meet at the old standing stones to trade, to find mates, to paint the spirals and to honour their mammoths."
 ek2lc_giant_gathering_decision_tooltip: "Lead your people to the Gathering at the Stones."
 ek2lc_giant_gathering_decision_confirm: "Let it begin"
 ek2lc_giant_gathering_modifier: "Gathering at the Stones"
 ek2lc_giant_gathering_modifier_desc: "This character is celebrating; their court wears its celebration dress."
 ek2lc_keptu_hunt_decision: "Hold the Bloodroot Hunt"
 ek2lc_keptu_hunt_decision_desc: "The warrior-smiths of the Keptu hold their hunt each year in the valleys below the Bloodroot Forge. The winner and their bear receive Hircine's marks."
 ek2lc_keptu_hunt_decision_tooltip: "Hold the Keptu hunt competition."
 ek2lc_keptu_hunt_decision_confirm: "Let it begin"
 ek2lc_keptu_hunt_modifier: "Bloodroot Hunt"
 ek2lc_keptu_hunt_modifier_desc: "This character is celebrating; their court wears its celebration dress."
 ek2lc_nede_watch_decision: "Keep the Watch of the Celestials"
 ek2lc_nede_watch_decision_desc: "When the Warrior, the Mage and the Thief rise together before dawn, the Cult of the Stars reads the coming year, calls the names of the dead and feeds the stars."
 ek2lc_nede_watch_decision_tooltip: "Keep the star-watch of the old Nedes."
 ek2lc_nede_watch_decision_confirm: "Let it begin"
 ek2lc_nede_watch_modifier: "Watch of the Celestials"
 ek2lc_nede_watch_modifier_desc: "This character is celebrating; their court wears its celebration dress."
 ek2lc_yokudan_sun_decision: "Celebrate Drigh R'Zimb"
 ek2lc_yokudan_sun_decision_desc: "In the hottest days of the year the Yokudans honour Daibethe, the sun: a fast, the new fire caught in a gold mirror, the sword-singers' dance and the feast."
 ek2lc_yokudan_sun_decision_tooltip: "Hold the jubilation for the sun Daibethe."
 ek2lc_yokudan_sun_decision_confirm: "Let it begin"
 ek2lc_yokudan_sun_modifier: "Drigh R'Zimb"
 ek2lc_yokudan_sun_modifier_desc: "This character is celebrating; their court wears its celebration dress."
 ek2lc_giant.0001.t: "The Clans Gather"
 ek2lc_giant.0001.desc: "The standing stones loom over the valley, and one by one the clans arrive with their mammoths. Fires are lit, and trading begins."
 ek2lc_giant.0001.a: "Trade mammoth cheese"
 ek2lc_giant.0001.b: "Trade ground tusk powder"
 ek2lc_giant.0001.c: "Bring gifts, not goods"
 ek2lc_giant.0002.t: "Painting the Spirals"
 ek2lc_giant.0002.desc: "The clans paint the stones and their own skin with spirals, as their forebears did. Which spiral will you wear this year?"
 ek2lc_giant.0002.a: "The Spiral of the Herd"
 ek2lc_giant.0002.b: "The Spiral of the Club"
 ek2lc_giant.0002.c: "The Spiral of the Long Walk"
 ek2lc_giant.0003.t: "The Old Mammoth"
 ek2lc_giant.0003.desc: "At the end of the gathering the oldest mammoth lies down in the steaming spring among the bones of those before it. The clans fall silent."
 ek2lc_giant.0003.a: "Sit with it until the end"
 ek2lc_giant.0003.b: "Carry its tusks home"
 ek2lc_keptu.0001.t: "Choosing the Bear"
 ek2lc_keptu.0001.desc: "Before the Bloodroot Hunt every hunter chooses a companion. The marked bears of the clan pace in their pens."
 ek2lc_keptu.0001.a: "The old she-bear, marked many times"
 ek2lc_keptu.0001.b: "The young cub I raised myself"
 ek2lc_keptu.0001.c: "I hunt alone"
 ek2lc_keptu.0003.t: "Hircine's Marks"
 ek2lc_keptu.0003.desc: "You return first, with the greatest kill. The warrior-smiths heat their needles and open their pots of ink."
 ek2lc_keptu.0003.a: "Mark my face"
 ek2lc_keptu.0003.b: "Mark the bear instead"
 ek2lc_keptu.0003.c: "Forge a trophy at the Bloodroot Forge"
 ek2lc_keptu.0004.t: "Unmarked"
 ek2lc_keptu.0004.desc: "Another hunter returns before you, dragging a greater kill. The ink pots are carried past you."
 ek2lc_keptu.0004.a: "The Huntsman favours whom he will"
 ek2lc_keptu.0004.b: "I demand another hunt"
 ek2lc_nede.0001.t: "Reading the Stars"
 ek2lc_nede.0001.desc: "Before dawn the star-readers climb the hill. The Warrior, the Mage and the Thief rise over the horizon, and everyone waits for the reading."
 ek2lc_nede.0001.a: "Trust the readers"
 ek2lc_nede.0001.b: "Read them myself"
 ek2lc_nede.0002.t: "Naming the Dead"
 ek2lc_nede.0002.desc: "As the stars fade into the dawn, the names of those who died since the last watch are called, so that they may rise and become stars."
 ek2lc_nede.0002.a: "I call the names myself"
 ek2lc_nede.0002.b: "Let the readers call them"
 ek2lc_nede.0003.t: "Feeding the Stars"
 ek2lc_nede.0003.desc: "The earth ovens are opened and the steam rises to feed the stars. What will you offer?"
 ek2lc_nede.0003.a: "Food from every field and river"
 ek2lc_nede.0003.b: "Nirncrux, red as the Warrior's eye"
 ek2lc_nede.0003.c: "Nothing; the stars are not hungry"
 ek2lc_yokudan.0001.t: "The Fast"
 ek2lc_yokudan.0001.desc: "For three days before Drigh R'Zimb no fire is lit and the faithful eat only raw grain and water."
 ek2lc_yokudan.0001.a: "Keep the fast strictly"
 ek2lc_yokudan.0001.b: "Fast as most do"
 ek2lc_yokudan.0001.c: "Daibethe will forgive a little bread"
 ek2lc_yokudan.0002.t: "The New Fire"
 ek2lc_yokudan.0002.desc: "At dawn the priest raises the polished gold mirror to Daibethe, and all wait for the sun to light the new fire."
 ek2lc_yokudan.0002.a: "Raise the mirror"
 ek2lc_yokudan.0003.t: "The Sword Dance"
 ek2lc_yokudan.0003.desc: "The sword-singers dance the Way of the Sword before the new fire, blades flashing like the sun."
 ek2lc_yokudan.0003.a: "Join the dance"
 ek2lc_yokudan.0003.b: "Reward the finest singer"
 ek2lc_yokudan.0003.c: "Watch in silence"
 ek2lc_yokudan.0004.t: "The Feast of Daibethe"
 ek2lc_yokudan.0004.desc: "The meat roasted on the new fire is shared out, and the jubilation lasts into the night."
 ek2lc_yokudan.0004.a: "Feast with everyone"
 ek2lc_keptu.0004.b.won: "You win the second hunt, and the ink is yours"
 ek2lc_keptu.0004.b.lost: "The second hunt goes worse than the first"
 ek2lc_nede.0001.bright: "The stars burn bright and clear: a good year"
 ek2lc_nede.0001.hazy: "The stars are hazy and huddled: a hard year"
 ek2lc_yokudan.0002.good: "The cotton catches at once: a fine omen"
 ek2lc_yokudan.0002.cloud: "Clouds cover Daibethe; the fire is drilled from sticks"
 ek2lc_yokudan.0002.bad: "The fire will not catch: an evil omen"
 ek2lc_yokudan.0003.a.won: "You dance like one of the Ansei"
 ek2lc_yokudan.0003.a.lost: "You stumble before the whole court"
 ek2lc_giant_spiral_herd_modifier: "Spiral of the Herd"
 ek2lc_giant_spiral_herd_modifier_desc: "The spiral of the herd is painted on this character."
 ek2lc_giant_spiral_club_modifier: "Spiral of the Club"
 ek2lc_giant_spiral_club_modifier_desc: "The spiral of the club is painted on this character."
 ek2lc_giant_spiral_walk_modifier: "Spiral of the Long Walk"
 ek2lc_giant_spiral_walk_modifier_desc: "The spiral of the long walk is painted on this character."
 ek2lc_keptu_marked_modifier: "Hircine's Marks"
 ek2lc_keptu_marked_modifier_desc: "This character won the Bloodroot Hunt and wears the Huntsman's marks."
 ek2lc_nede_bright_year_modifier: "A Bright Year"
 ek2lc_nede_bright_year_modifier_desc: "The stars promised a good year."
 ek2lc_nede_hazy_year_modifier: "A Hazy Year"
 ek2lc_nede_hazy_year_modifier_desc: "The stars foretold a hard year."
 ek2lc_nede_starfed_modifier: "Fed the Stars"
 ek2lc_nede_starfed_modifier_desc: "This character offered nirncrux to the stars."
 ek2lc_yokudan_good_fire_modifier: "Daibethe's Fire"
 ek2lc_yokudan_good_fire_modifier_desc: "The new fire caught at once."
 ek2lc_yokudan_bad_fire_modifier: "The Fire That Would Not Catch"
 ek2lc_yokudan_bad_fire_modifier_desc: "An evil omen at Drigh R'Zimb."
 ek2lc_yokudan_anseilak_modifier: "Hel Anseilak"
 ek2lc_yokudan_anseilak_modifier_desc: "This character danced the Way of the Sword like a saint of the sword."
