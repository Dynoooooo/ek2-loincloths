l_english:
 artifact_ek2lc_loincloth_regalia: "Ceremonial Regalia"
 artifacts_artifact_type_ek2lc_loincloth_regalia: "Ceremonial Loincloth Regalia"
 artifact_type_ek2lc_loincloth_regalia: "ceremonial regalia"
 ek2lc_regalia_art_champion_name: "Champion's Apron"
 ek2lc_regalia_art_champion_desc: "A tall belt of dark silk wound with gold cord, and below it an apron that falls to the shins, embroidered with a sun over a mountain and hemmed in gold fringe. Patrons give such aprons to the fighters they favour, and a champion wears it to step before the crowd."
 ek2lc_regalia_art_fauld_name: "Malacath's Iron Fauld"
 ek2lc_regalia_art_fauld_desc: "A riveted iron belt with four overlapping iron lames hanging in front, tied with leather straps, and a boss at the buckle stamped for Malacath. Stronghold smiths make it for those who stand in the front rank."
 ek2lc_regalia_art_feather_name: "Feather Girdle of the Ancestors"
 ek2lc_regalia_art_feather_desc: "A sash covered in red and gold feathers, fringed with more feathers all round, and a long tail on the left hip strung with teeth. Each wearer is said to add the mana of those who wore it before."
 ek2lc_regalia_art_briar_name: "Briarheart Girdle"
 ek2lc_regalia_art_briar_desc: "A tooled belt of Reach hide stamped with bear, elk, wolf and raven, bound in two thorned briar vines, with a bronze bear plaque at the front and hagraven feathers at the hips."
 ek2lc_regalia_art_amber_name: "Hist-Amber Wrap"
 ek2lc_regalia_art_amber_desc: "A hip wrap of tightly woven marsh grass, with strings of Hist-resin amber hanging across the front and two plates of tortoise shell at the hips."
 ek2lc_regalia_art_bone_name: "Green Pact Bone Apron"
 ek2lc_regalia_art_bone_desc: "A rawhide belt hung front and back with rows of bone hairpipes and beetle-shell beads. No wood, no plant fibre: everything in it comes from the hunt, as the Green Pact asks."
 ek2lc_regalia_art_ash_name: "Ancestor-Ash Tassets"
 ek2lc_regalia_art_ash_desc: "Two crossing belts of guar leather, a carved chitin buckle, and enamelled chitin tassets over the thighs in the colours of the tribe. Ashlanders say their ancestors see them better when they wear it."
 ek2lc_regalia_art_moon_name: "Mane's Moon Silk"
 ek2lc_regalia_art_moon_desc: "A sash of deep purple silk embroidered with crescent moons, knotted at the hip with two long tails, and two discs hanging from the knot: red Masser and silver Secunda."
 ek2lc_commission_regalia_decision: "Commission Ceremonial Regalia"
 ek2lc_commission_regalia_decision_desc: "The weavers, bead-workers and smiths of our people can make regalia worthy of a ruler: a girdle or apron worn over the loincloth at court, and passed down the line."
 ek2lc_commission_regalia_decision_tooltip: "Order a wearable regalia artifact that shows on your portrait."
 ek2lc_commission_regalia_decision_confirm: "Summon the weavers"
 ek2lc_commission_regalia_decision_effect_tt: "You choose a style and how fine a work. Some months later the regalia is finished, if all goes well, and you wear it at once."
 ek2lc_commission_pending_tt: "The weavers are already at work on your regalia"
 ek2lc_regalia.0001.t: "The Weavers' Hall"
 ek2lc_regalia.0001.desc: "The master weaver bows and lays out samples on the floor: dyed hide, silk, beadwork, feathers, iron lames. "Tell us what you wish to wear, and we will make it.""
 ek2lc_regalia.0001.home_art_fauld: "Our own people's work: Malacath's Iron Fauld"
 ek2lc_regalia.0001.home_art_feather: "Our own people's work: a Feather Girdle of the Ancestors"
 ek2lc_regalia.0001.home_art_briar: "Our own people's work: a Briarheart Girdle"
 ek2lc_regalia.0001.home_art_amber: "Our own people's work: a Hist-Amber Wrap"
 ek2lc_regalia.0001.home_art_bone: "Our own people's work: a Green Pact Bone Apron"
 ek2lc_regalia.0001.home_art_ash: "Our own people's work: Ancestor-Ash Tassets"
 ek2lc_regalia.0001.home_art_moon: "Our own people's work: Mane's Moon Silk"
 ek2lc_regalia.0001.champion: "A Champion's Apron, long and embroidered"
 ek2lc_regalia.0001.feather: "A Feather Girdle of the Ancestors"
 ek2lc_regalia.0001.foreign: "Show me what other peoples wear"
 ek2lc_regalia.0001.cancel: "Not now"
 ek2lc_regalia.0002.t: "Foreign Fashions"
 ek2lc_regalia.0002.desc: ""We have traded with every people from the Reach to Elsweyr," the weaver says. "Their styles are not ours, but we know them.""
 ek2lc_regalia.0002.art_fauld: "Malacath's Iron Fauld"
 ek2lc_regalia.0002.art_briar: "Briarheart Girdle"
 ek2lc_regalia.0002.art_amber: "Hist-Amber Wrap"
 ek2lc_regalia.0002.art_bone: "Green Pact Bone Apron"
 ek2lc_regalia.0002.art_ash: "Ancestor-Ash Tassets"
 ek2lc_regalia.0002.art_moon: "Mane's Moon Silk"
 ek2lc_regalia.0002.back: "Let me think again"
 ek2lc_regalia.0003.t: "How Fine a Work?"
 ek2lc_regalia.0003.desc: ""Rough work is quick and cheap. Fine work takes longer. A masterwork takes the whole guild half a year, and it will outlive your grandchildren.""
 ek2lc_regalia.0003.rough: "Rough work will do"
 ek2lc_regalia.0003.fine: "Fine work"
 ek2lc_regalia.0003.masterwork: "Nothing less than a masterwork"
 ek2lc_regalia.0003.cancel: "I have changed my mind"
 ek2lc_regalia.0003.wait_tt: "The regalia will be ready in a few months"
 ek2lc_regalia.0010.t: "The Regalia Is Finished"
 ek2lc_regalia.0010.desc: "The weavers carry it in on a cushion: [ek2lc_new_regalia.GetName]. They tie it on you themselves, and the court falls silent to look."
 ek2lc_regalia.0010.a: "Let them look!"
 ek2lc_regalia.0010.b: "We thank the ancestors for such hands"
 ek2lc_regalia.0011.t: "The Weaver Has Fled"
 ek2lc_regalia.0011.desc: "The workshop is empty: the looms cold, the beads gone, and the master weaver with them, together with your gold."
 ek2lc_regalia.0011.a: "Hunt them down!"
 ek2lc_regalia.0011.a.found: "The weaver is found hiding with the half-finished work, and finishes it under guard"
 ek2lc_regalia.0011.a.lost: "The trail goes cold"
 ek2lc_regalia.0011.b: "Let them go. The gold is lost"
 ek2lc_regalia.0012.t: "An Offer for the Work"
 ek2lc_regalia.0012.desc: "[ek2lc_bidder.GetTitledFirstName] has seen your regalia on the loom and wants it badly: they offer to buy it for 150 gold before it is even finished."
 ek2lc_regalia.0012.a: "Sell it"
 ek2lc_regalia.0012.b: "It is not for sale"
 ek2lc_regalia.0020.t: "A Gift of Cloth"
 ek2lc_regalia.0020.desc: "[ek2lc_patron.GetTitledFirstName] has sent a Champion's Apron to court, embroidered and fringed with gold, as a gift for [ek2lc_champion.GetFirstName], who fights in your name. By custom it is yours to bestow."
 ek2lc_regalia.0020.a: "Let [ek2lc_champion.GetFirstName] wear it with pride"
 ek2lc_regalia.0020.b: "Such an apron belongs to the ruler"
 ek2lc_regalia.0030.t: "Moths in the Wardrobe"
 ek2lc_regalia.0030.desc: "A servant brings [ek2lc_moth_regalia.GetName] with a worried look: moths have been at it, and some of the work is coming loose."
 ek2lc_regalia.0030.a: "Have the weavers mend it"
 ek2lc_regalia.0030.b: "A little wear shows its age"
 ek2lc_regalia.0040.t: "The Forebear's Regalia"
 ek2lc_regalia.0040.desc: "[ek2lc_heirloom.GetName] was made for [ek2lc_forebear.GetFirstName], and now it is yours. The elders say you should wear it before the whole court, so all can see whose heir you are."
 ek2lc_regalia.0040.a: "Wear it before the court"
 ek2lc_regalia.0040.b: "Keep it safe, and pray to the ancestors"
 ek2lc_life.0001.t: "The First Loincloth"
 ek2lc_life.0001.desc: "At fourteen you are given your first warrior's loincloth, plain hide with a single mark painted on it by the elders. Which beast's mark will you carry?"
 ek2lc_life.0001.bear: "The bear: strength"
 ek2lc_life.0001.raven: "The raven: cunning"
 ek2lc_life.0001.elk: "The elk: endurance and plenty"
 ek2lc_life.0002.t: "[ROOT.Char.GetFirstName]'s First Loincloth"
 ek2lc_life.0002.desc: "[ROOT.Char.GetFirstName] has turned fourteen, and today receives a first warrior's loincloth. By custom a parent ties the knot."
 ek2lc_life.0002.a: "I will tie it myself"
 ek2lc_life.0002.b: "Let the elders do it"
 ek2lc_life.0010.t: "Another Trophy for the Belt"
 ek2lc_life.0010.desc: "After the battle your warriors bring you a tooth from the field, to hang from your belt with the others. You have won [ROOT.Char.MakeScope.Var('ek2lc_battles_won').GetValue|0] battles now."
 ek2lc_life.0010.a: "Hang it with the others"
 ek2lc_life.0010.b: "Let the enemy see it and despair"
 ek2lc_life.0020.t: "The Knot Gives Way"
 ek2lc_life.0020.desc: "In the middle of the feast, as you rise to toast your guests, the knot of your loincloth gives way. You catch it in time, but the whole hall saw."
 ek2lc_life.0020.a: "Laugh, and retie it"
 ek2lc_life.0020.b: "Who tied this? Fetch the weaver!"
 ek2lc_life.0020.c: "Announce that this is how it is worn now"
 ek2lc_life.0030.t: "The Weavers' Petition"
 ek2lc_life.0030.desc: "The weavers' guild asks that fine-spun cloth, dyed hide and beadwork be kept for the nobility, as the old law said. Commoners, they complain, now dress like chiefs."
 ek2lc_life.0030.a: "The old law stands: fine cloth for the noble"
 ek2lc_life.0030.b: "Let anyone wear what they can make"
 ek2lc_life.0030.c: "Let them wear it, and pay for the right"
 ek2lc_life.0040.t: "A Scandalised Guest"
 ek2lc_life.0040.desc: "[ek2lc_envoy.GetTitledFirstName] cannot take their eyes off the court's dress, or rather the lack of it, and has asked whether you could perhaps put on a robe."
 ek2lc_life.0040.a: "This is how our people dress"
 ek2lc_life.0040.b: "Give our guest a robe of their own"
 ek2lc_life.0040.c: "Explain our customs, and win them over"
 ek2lc_life.0050.t: "The Sap of the Hist"
 ek2lc_life.0050.desc: "The tenders of the Hist offer to steep your loincloth and regalia in its sap, as the old ones did. Those who wear what the Hist has touched are said to hear it in their sleep."
 ek2lc_life.0050.a: "Let the Hist touch it"
 ek2lc_life.0050.b: "The Hist knows me already"
 ek2lc_life.0070.t: "Hircine's Night"
 ek2lc_life.0070.desc: "You wake at dawn in the forest, the taste of blood in your mouth, and of your loincloth nothing is left but shreds on the brambles."
 ek2lc_life.0070.a: "Send quietly for a new one"
 ek2lc_life.0070.b: "Let them see what the Hunter made of me"
 ek2lc_life.0080.t: "A Cold Snap"
 ek2lc_life.0080.desc: "The frost has come early. [ek2lc_cold.GetFirstName] is shivering in the hall in nothing but a loincloth, and asks for hide leggings and a fur."
 ek2lc_life.0080.a: "Give them leggings and a fur"
 ek2lc_life.0080.b: "The cold makes us strong"
 ek2lc_clan_mark_bear_modifier: "Mark of the Bear"
 ek2lc_clan_mark_bear_modifier_desc: "The bear painted on this character's first loincloth."
 ek2lc_clan_mark_raven_modifier: "Mark of the Raven"
 ek2lc_clan_mark_raven_modifier_desc: "The raven painted on this character's first loincloth."
 ek2lc_clan_mark_elk_modifier: "Mark of the Elk"
 ek2lc_clan_mark_elk_modifier_desc: "The elk painted on this character's first loincloth."
 ek2lc_tie_snapped_modifier: "The Knot That Gave Way"
 ek2lc_tie_snapped_modifier_desc: "The whole court still talks about the feast."
 ek2lc_loincloth_fashion_modifier: "Setter of Fashions"
 ek2lc_loincloth_fashion_modifier_desc: "This character made a mishap into a fashion."
 ek2lc_sumptuary_enforced_modifier: "Sumptuary Law"
 ek2lc_sumptuary_enforced_modifier_desc: "Fine cloth is kept for the nobility."
 ek2lc_sumptuary_relaxed_modifier: "Cloth for All"
 ek2lc_sumptuary_relaxed_modifier_desc: "Anyone may wear what they can make."
 ek2lc_fine_cloth_tax_modifier: "Fine Cloth Tax"
 ek2lc_fine_cloth_tax_modifier_desc: "Commoners pay for the right to wear fine cloth."
 ek2lc_hist_blessed_modifier: "Touched by the Hist"
 ek2lc_hist_blessed_modifier_desc: "This character's dress was steeped in the sap of the Hist."
 ek2lc_proud_dress_modifier: "Proud of Our Dress"
 ek2lc_proud_dress_modifier_desc: "This character refused to dress like a foreigner."
 ek2lc_hircine_hunt_modifier: "Hunter's Mark"
 ek2lc_hircine_hunt_modifier_desc: "This character wears the shreds of Hircine's night openly."
